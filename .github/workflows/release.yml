# Builds a release on a clean Windows runner: portable binaries, models re-exported
# from the official ModelScope weights (verified byte-identical, tools/models.lock.json;
# taken from the previous release when unchanged), packages, and the client tests
# against exactly those packages.
#   push a tag v<version> (= project VERSION in CMakeLists.txt) -> GitHub release with the files
#   run manually (Actions -> release -> Run workflow)              -> the files as a build artifact
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build-time Python packages (model export, meson)
        run: pip install -r tools/requirements-release.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Visual Studio developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache the official model weights
        uses: actions/cache@v4
        with:
          path: build-models/modelscope
          key: modelscope-${{ hashFiles('tools/models.lock.json') }}

      # Unchanged models (same models_version) are not downloaded and exported again: the
      # latest release's GGUFs go where tools/export_models.py writes, and it keeps each one
      # only if it has the validated SHA-256 (otherwise it exports from the official weights).
      # Caches saved on a tag are not visible to the next tag, so the cache above rarely helps.
      - name: Models of the previous release
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mv=$(python -c "import json; print(json.load(open('tools/models.lock.json'))['models_version'])")
          zip="mintbot-voice-models-$mv.zip"
          tmp=$(mktemp -d)
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern "$zip" --dir "$tmp"; then
            mkdir -p build-models/out
            python -c "import sys, zipfile; z = zipfile.ZipFile(sys.argv[1]); [z.extract(n, sys.argv[2]) for n in z.namelist() if n.endswith('.gguf') and '/' not in n]" "$tmp/$zip" build-models/out
            ls -l build-models/out
          else
            echo "no $zip in the latest release: the models are exported from the official weights"
          fi

      # PowerShell, not bash: Git Bash puts Git's GNU link.exe ahead of MSVC's linker on PATH
      - name: Build, export models, package, test
        shell: pwsh
        run: |
          $tag = @()
          if ("${{ github.ref_type }}" -eq "tag") { $tag = @("--tag", "${{ github.ref_name }}") }
          python tools/build_release.py --out dist @tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep the files (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: mintbot-voice-agent-release
          path: dist

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          files=(dist/"${version#v}"/*)
          [ "${#files[@]}" -eq 5 ] || { echo "expected 5 release files, got: ${files[*]}"; exit 1; }
          # re-running the job (e.g. after a failed upload) replaces the files instead of failing
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" "${files[@]}" --clobber
            gh release edit "$version" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$version" "${files[@]}" --title "$version" --notes-file dist/RELEASE_NOTES.md
          fi
